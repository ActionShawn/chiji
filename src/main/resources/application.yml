# D:\Java Work Place\personal-develop\teeth-trace\server\src\main\resources\application.yml
# 基础配置（默认值面向本地开发，生产环境通过环境变量覆盖）
server:
  port: 8080

spring:
  application:
    name: chiji-server
  # 默认激活 dev profile：无论 IDEA 还是命令行启动均走 dev 环境（测试用户模式，绕过微信登录）。
  # 生产部署时通过环境变量 SPRING_PROFILES_ACTIVE=prod 覆盖。
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # 开启 JDK21 虚拟线程
  threads:
    virtual:
      enabled: true
  # 文件上传大小限制（单文件 20MB / 整请求 120MB）
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 120MB
  # 数据源（环境变量占位，默认本地 MySQL）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_ADDRESS:${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}}/teeth-trace?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    # 密码不提供默认值（公开仓库禁止明文密码），本地联调请通过环境变量 MYSQL_PASSWORD 注入
    password: ${MYSQL_PASSWORD:}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      # 连接保活与生命周期：防止 MySQL 服务端回收空闲连接后复用死连接导致 Communications link failure
      connection-test-query: SELECT 1
      validation-timeout: 3000
      max-lifetime: 600000 # 10 分钟，低于服务端 wait_timeout
      keepalive-time: 60000 # 60 秒探活一次
  # Redis（主机/端口公共占位，默认本地；密码按环境隔离，见 application-dev/prod.yml，不在此写死）
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 0
  # Spring AI（OpenAI 协议，默认对接 DeepSeek，可通过 base-url 切换为通义等）
  ai:
    openai:
      api-key: ${AI_API_KEY:sk-placeholder}
      base-url: ${AI_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${AI_MODEL:deepseek-chat}

# Sa-Token 认证配置
sa-token:
  token-name: Authorization # Token 从名为 Authorization 的请求头读取
  timeout: 604800 # Token 有效期 7 天（秒）
  active-timeout: -1 # 活跃有效期：-1 表示不限制
  is-concurrent: true # 同一账号允许同时在线
  is-share: false # 新登录不强制踢掉旧登录
  token-style: uuid # Token 风格：uuid
  is-read-cookie: false # 不从 Cookie 读取 Token
  is-read-header: true # 从请求头读取 Token

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.chiji.module.**.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_id # 雪花算法主键
      logic-delete-field: deleted # 全局逻辑删除字段
      logic-delete-value: 1 # 已删除
      logic-not-delete-value: 0 # 未删除

# SpringDoc / Knife4j 接口文档
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

knife4j:
  enable: true
  setting:
    language: zh_cn

# ============================ 自定义配置 ============================
chiji:
  # 跨域白名单：* 表示放行全部来源（生产环境请在 application-prod.yml 中覆盖）
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  # 微信小程序（appid/secret 属机密凭据，禁止写默认明文；必须由环境变量 WECHAT_APPID/WECHAT_SECRET 注入）
  wechat:
    appid: ${WECHAT_APPID:}
    secret: ${WECHAT_SECRET:}
    # 一次性订阅消息（换副提醒）：模板 ID 非机密，允许写默认值；enabled=false 时仅站内消息
    subscribe:
      enabled: ${WECHAT_SUBSCRIBE_ENABLED:true}
      aligner-change-template-id: ${WECHAT_TMPL_ALIGNER_CHANGE:8OJWmrJwUswD20NH4QIl69nrx7IEb6TOstBzMr6XYZU}
      clinic-visit-template-id: ${WECHAT_TMPL_CLINIC_VISIT:7ZnVj_3OovBDQkNdVnvU6WgTvJ3kr-pjV6h9K4lG5ro}
      clinic-book-template-id: ${WECHAT_TMPL_CLINIC_BOOK:7ZnVj_3OovBDQkNdVnvU6avkNIOcBQFELztsIxGeMQE}
      page: ${WECHAT_SUBSCRIBE_PAGE:pages/index/index}
      miniprogram-state: ${WECHAT_MINIPROGRAM_STATE:formal}
  # 阿里云 OSS
  oss:
    endpoint: ${OSS_ENDPOINT:}
    bucket: ${OSS_BUCKET:}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
  # 文件存储策略：local（本地磁盘，默认）/ cos（腾讯云 COS，云托管推荐）
  storage:
    type: ${STORAGE_TYPE:local}
    local:
      # 本地存储根目录（与 WebConfig 的 /uploads/** 静态资源映射指向同一路径）
      base-path: ${STORAGE_LOCAL_BASE_PATH:D:/chiji/uploads}
      # 对外可访问 URL 前缀（开发环境即后端地址 + /uploads）
      base-url: ${STORAGE_LOCAL_BASE_URL:http://localhost:8080/uploads}
    cos:
      # 腾讯云 COS 密钥/地域/Bucket（存储桶建议开启公有读或经 CDN 加速域名访问）
      secret-id: ${COS_SECRET_ID:}
      secret-key: ${COS_SECRET_KEY:}
      region: ${COS_REGION:ap-shanghai}
      bucket: ${COS_BUCKET:}
      # 对外可访问 URL 前缀（Bucket 公网访问域名或 CDN 域名，如 https://xxx.cos.ap-shanghai.myqcloud.com）
      base-url: ${COS_BASE_URL:}
  # 首页天气（和风天气）：Host/Key 属机密凭据，禁止写默认明文，须由环境变量注入；
  # 未注入时 configured() 返回 false，接口直接降级，不影响启动。
  weather:
    enabled: ${CHIJI_WEATHER_ENABLED:true}
    # 账号专属 API Host（和风控制台 → 设置 查看，形如 abcxyz.qweatherapi.com，不含协议；
    # 公共域名自 2026 年起逐步停服，且 Host 本身是鉴权的一部分，必须配置）
    host: ${WEATHER_API_HOST:}
    key: ${WEATHER_API_KEY:}
    cache:
      # 实时天气缓存时长（分钟）：同城同区同小时共享，同一区县缓存期内只打一次三方
      now-ttl-minutes: ${CHIJI_WEATHER_NOW_TTL:60}
      # 城市反查缓存时长（分钟）：按取整坐标共享，默认 24h
      geo-ttl-minutes: ${CHIJI_WEATHER_GEO_TTL:1440}
    quota:
      # 每自然月免费调用上限（和风「天气和基础服务」组：预报 + GeoAPI 同组累进）
      monthly-limit: ${CHIJI_WEATHER_MONTHLY_LIMIT:50000}
      # 安全水位比例：0.9 即月调用量达 45000 次触发熔断，停止调三方避免产生费用
      safety-ratio: ${CHIJI_WEATHER_SAFETY_RATIO:0.9}
  # Spring AI 链路开关（false 时不注册 AI 相关 Bean，/api/ai/ping 返回未启用提示）
  ai:
    enabled: ${CHIJI_AI_ENABLED:false}
  # 管理后台 P2 采集层：接口监控（拦截器计时 + 阈值采集 + 计数器刷盘）
  metrics:
    # 采集总开关（线上异常可置 false 一键止血，拦截器零开销跳过）
    enabled: ${CHIJI_METRICS_ENABLED:true}
    # 慢请求阈值（ms）：超过即写 slow_api_log 明细并计入慢请求数
    slow-threshold-ms: ${CHIJI_METRICS_SLOW_MS:500}
    # 明细保留天数（超期物理删除；聚合表永久保留）
    slow-log-retention-days: 90
    login-log-retention-days: 365
    usage-session-retention-days: 180
  # 埋点上报：使用会话（App 级）防刷限频
  track:
    # 单用户每小时上报上限（正常前后台切换一天几十次）
    session-rate-limit-per-hour: 30
  # 开发者在线测试模块（/api/dev/**）：默认关闭；开启后该前缀路由免登录，仅联调环境临时打开
  dev-test:
    enabled: ${CHIJI_DEV_TEST_ENABLED:false}
