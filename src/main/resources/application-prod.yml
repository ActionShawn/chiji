# D:\Java Work Place\personal-develop\teeth-trace\server\src\main\resources\application-prod.yml
# 生产环境：关闭接口文档、收敛日志级别、严格跨域白名单
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_ADDRESS:${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}}/teeth_trace?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true

  # Redis 密码无默认值：生产必须由云托管环境变量 REDIS_PASSWORD 显式注入（公开仓库禁止明文）
  data:
    redis:
      password: ${REDIS_PASSWORD:}

# 生产环境关闭接口文档
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

knife4j:
  enable: false

# 跨域白名单：生产环境必须显式配置，多个域名用英文逗号分隔
# 云托管部署时请将 CORS_ALLOWED_ORIGINS 设为云托管服务域名
chiji:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://chiji.service.tcloudbase.com}

logging:
  level:
    root: info
    com.chiji: info
  # 日志文件路径（由 logback-spring.xml 的 FILE 追加器落盘，按天滚动保留 30 天）
  file:
    name: ${LOG_PATH:./logs}/chiji-server.log
